<link rel="preload" href="assets/fonts/Rubik-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles/ui.css">
<style>
  /* touch-action: none is a prerequisite, not polish: Android Chrome ignores user-scalable=no, so without it the second
     finger of a look+fire gesture is read as a pinch and BOTH pointers get cancelled. overscroll-behavior stops a
     downward drag near the top from turning into pull-to-refresh mid-round. */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1020; user-select: none; -webkit-user-select: none;
    touch-action: none; overscroll-behavior: none; -webkit-touch-callout: none; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; width: 100%; height: 100%; outline: none; }
  #ui-root { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  #fade { position: fixed; inset: 0; background: #0d1020; opacity: 1; pointer-events: all; z-index: 50; transition: opacity 600ms ease; }
  /* Wide enough to read on a phone, scrollable so a long message is never clipped, and selectable so the text can be
     copied off the device. */
  #boot-error { display: none; position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 60; color: #fff;
    font: 600 15px/1.45 system-ui, sans-serif; background: #c0263d; padding: 18px 20px; border-radius: 12px;
    width: min(88vw, 560px); max-height: 72vh; overflow: auto; word-break: break-word;
    user-select: text; -webkit-user-select: text; box-shadow: 0 12px 40px rgba(0, 0, 0, .55); }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/jsm/" } }
</script>
</head>
<body>
<div id="app"></div>
<div id="ui-root"></div>
<div id="fade"></div>
<div id="boot-error"></div>
<script>
  // fade in once the loading screen is mounted
  window.addEventListener('DOMContentLoaded', () => setTimeout(() => { const f = document.getElementById('fade'); if (f) { f.style.opacity = '0'; f.style.pointerEvents = 'none'; } }, 60));

  // Remote error beacon. A phone has no console you can attach, so a failure there is otherwise invisible — and the
  // red box below can be missed or covered. A fire-and-forget GET to a path that cannot exist lands in the dev
  // server's log (tools/serve.py logs every 4xx together with its path), which is enough to diagnose the device from
  // the machine serving it. Deliberately in index.html rather than main.js: this way it also catches a failure while
  // the module itself is still loading.
  // Only on a host where a dev server is actually listening for it. The beacon works by requesting a path that cannot
  // exist and relying on tools/serve.py logging every 4xx — on a public host that is just a wasted request and a red
  // console line on every load. `?beacon` forces it on for a device test against a real deployment. Opened from the
  // IELTS-Base App (?from=app: app/game/ under ielts-base://app, or her server on the LAN) there is no dev server to
  // listen: off there too, whatever the host name (docs/LEARN.md §16).
  const BEACON_ON = (() => {
    try {
      const h = location.hostname, q = new URLSearchParams(location.search);
      if (q.has('beacon')) return true;
      if (q.get('from') === 'app' || /\/game\/(?:index\.html)?$/.test(location.pathname)) return false;
      return h === 'localhost' || h === '127.0.0.1' || h === '[::1]' || h.endsWith('.local')
        || /^(10|192\.168|172\.(1[6-9]|2\d|3[01]))\./.test(h);
    } catch (e) { return false; }
  })();
  window.__beacon = (kind, msg) => {
    if (!BEACON_ON) return;
    // Truncate BEFORE encoding: percent-encoding inflates a stack trace roughly threefold, so slicing the encoded
    // form (as this first did) cut it to a third of the intended length.
    try { fetch('/__inkwave_error/' + encodeURIComponent((kind + ': ' + String(msg)).slice(0, 1800))).catch(() => {}); } catch (e) { /* give up quietly */ }
  };
  window.addEventListener('error', (e) => { if (e && e.message) window.__beacon('error', e.message + ' @ ' + (e.filename || '?') + ':' + (e.lineno || 0)); });
  window.addEventListener('unhandledrejection', (e) => window.__beacon('rejection', (e && e.reason && e.reason.message) || String(e && e.reason)));
</script>
<script>
  // 游戏为主体（IELTS-Base docs/GAME-FIRST.md 第一期）: opened from her App (?from=app) this is the App's front page. If the
  // game cannot start — no WebGL, a module that fails to load, a fatal boot error, a boot that has not finished in 60 s — she
  // goes back to the lesson page by herself (../index.html?classic=1&why=…) instead of a red box she cannot get past.
  // Her App's native events reach this page too (window.__IELTS_NATIVE_EVENT): a tapped review reminder opens the review
  // page there; the rest is kept for the renderer (window.__iwNative: power / thermal).
  (function () {
    try {
      const q = new URLSearchParams(location.search);
      if (q.get('from') !== 'app') return;
      let gone = false;
      const booted = () => !!(window.__inkwave && window.__inkwave.bootMs != null);
      window.__gfBack = (why) => {
        if (gone || booted()) return;
        gone = true;
        try { location.replace('../index.html?classic=1&why=' + encodeURIComponent(String(why || 'boot').slice(0, 80))); } catch (e) { /* stay */ }
      };
      setTimeout(() => window.__gfBack('slow'), 60000);
      const N = (window.__iwNative = window.__iwNative || { power: null, events: [] });
      const prev = window.__IELTS_NATIVE_EVENT;
      window.__IELTS_NATIVE_EVENT = function (evt) {
        try {
          const e = typeof evt === 'string' ? JSON.parse(evt) : evt;
          if (!e || typeof e !== 'object') return;
          if (e.type === 'notify.open' && e.kind === 'review') { location.href = '../index.html?classic=1&open=review'; return; }
          if (e.type === 'power') N.power = { lowPower: !!e.lowPower, thermal: String(e.thermal || '') };
          N.events.push(e); if (N.events.length > 20) N.events.shift();
          if (typeof N.on === 'function') N.on(e);
        } catch (err) { /* a malformed event is dropped */ }
        if (typeof prev === 'function') try { prev(evt); } catch (err) { /* ignore */ }
      };
    } catch (e) { /* the game as before */ }
  })();
</script>
<script type="module" src="./src/main.js" onerror="window.__gfBack && window.__gfBack('module')"></script>
</body>
</html>
