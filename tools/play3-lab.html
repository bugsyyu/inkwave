<style>
  @font-face { font-family: 'Titan One'; src: url('../assets/fonts/TitanOne-latin.woff2') format('woff2'); font-display: block; }
  @font-face { font-family: 'Rubik'; src: url('../assets/fonts/Rubik-latin.woff2') format('woff2'); font-weight: 400 900; }
  html, body { margin: 0; height: 100%; background: #9fd8f0; overflow: hidden; touch-action: none; }
  #app { position: fixed; inset: 0; }
  #ui-root { position: fixed; inset: 0; pointer-events: none; }
  #panel {
    position: fixed; top: 8px; right: 8px; z-index: 50; display: flex; flex-wrap: wrap; gap: 4px; max-width: 320px; justify-content: flex-end;
    font: 600 11px/1 Rubik, system-ui, sans-serif; pointer-events: auto;
  }
  #panel button { appearance: none; border: 1px solid rgba(255,255,255,.25); background: rgba(16,18,24,.66); color: #fff; padding: 6px 8px; border-radius: 8px; font: inherit; cursor: pointer; }
  #panel.hidden, body.shot #panel, body.shot #stats { display: none; }
  #stats { position: fixed; left: 8px; bottom: 8px; z-index: 50; color: #fff; font: 500 10px/1.3 ui-monospace, monospace; background: rgba(0,0,0,.45); padding: 4px 6px; border-radius: 6px; white-space: pre; pointer-events: none; }
  /* the question strip stand-in (play-1's play-strip.js is not merged here): one line, top centre, coral on a miss */
  #say { position: fixed; left: 50%; top: 14px; translate: -50% 0; z-index: 40; max-width: calc(100vw - 32px); padding: 10px 18px; border-radius: 20px; background: rgba(14,12,22,.9);
    border: 1.5px solid rgba(255,255,255,.14); color: #fff; font: 800 19px/1.3 Rubik, 'PingFang SC', 'WenQuanYi Zen Hei', system-ui, sans-serif; pointer-events: none; opacity: 0; transition: opacity .2s; text-align: center; }
  #say.on { opacity: 1; } #say.coral { border-color: #f08a7a; color: #f08a7a; } #say.ink { border-color: var(--ink, #ff8a14); color: var(--ink, #ff8a14); }
  #say small { display: block; font-size: 17px; font-weight: 600; color: #c3bdd6; }
  @media (orientation: portrait) { #say { top: 58px; left: 10px; right: 10px; translate: none; } }
</style>
